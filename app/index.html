<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Services Automation</title>

    <!-- SAP Fiori launchpad (sandbox): the apps depend on the role of the logged-in user -->
    <script>
        (function () {
            // who is logged in (XSUAA login via approuter) - synchronous: needed before the launchpad starts
            var me = { name: "User", email: "", isAdmin: false };
            try {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/odata/v4/psa/whoAmI()", false);
                xhr.setRequestHeader("Accept", "application/json");
                xhr.send();
                if (xhr.status === 200) me = JSON.parse(xhr.responseText);
            } catch (e) { /* not logged in -> employee apps only */ }

            // one Fiori Elements app per intent (semantic object - action)
            var applications = {};
            var app = function (intent, component, title, description) {
                applications[intent] = {
                    title: title,
                    description: description,
                    additionalInformation: "SAPUI5.Component=psa." + component,
                    applicationType: "URL",
                    url: "./" + component + "/webapp",
                    navigationMode: "embedded"
                };
            };

            app("Timesheet-manage", "timesheets", "My Timesheets", "Log hours and submit");
            if (me.isAdmin) {
                app("Manager-home",    "home",       "Manager Home",       "KPIs and budget burn");
                app("Approval-manage", "approvals",  "Approve Timesheets", "Approve or reject");
                app("Project-manage",  "projects",   "Projects",           "Budget, milestones, tasks");
                app("Invoice-manage",  "invoices",   "Billing Workbench",  "Generate, issue, paid");
                app("Client-manage",   "clients",    "Clients",            "Master data");
                app("Employee-manage", "employees",  "Employees",          "Master data");
            }

            var names = String(me.name || me.email || "User").split(" ");

            window["sap-ushell-config"] = {
                defaultRenderer: "fiori2",
                services: {
                    // real user in the shell header instead of "Default User"
                    Container: {
                        adapter: {
                            config: {
                                id: me.email || me.user || "USER",
                                firstName: names[0],
                                lastName: names.slice(1).join(" "),
                                fullName: me.name || me.email,
                                email: me.email
                            }
                        }
                    },
                    EndUserFeedback: { config: { enabled: false } }
                },
                renderers: {
                    fiori2: {
                        componentData: {
                            config: {
                                // start page: Admin -> Manager Home (ALP), User -> My Timesheets
                                rootIntent: me.isAdmin ? "Manager-home" : "Timesheet-manage",
                                enableNotificationsUI: false,
                                enableNotifications: false,
                                enableSearch: false,
                                enablePersonalization: false,
                                enableSetTheme: true,
                                enableSetLanguage: true
                            }
                        }
                    }
                },
                applications: applications
            };
        }());
    </script>

    <script id="sap-ushell-bootstrap" src="https://sapui5.hana.ondemand.com/1.153.0/test-resources/sap/ushell/bootstrap/sandbox.js"></script>

    <script id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.153.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.ui.core, sap.ushell, sap.fe.templates"
        data-sap-ui-compat-version="edge"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="allow"
        data-sap-ui-preload="async"></script>

    <script>
        sap.ui.getCore().attachInit(function () {

            // show only our apps on the tile page: drop the sandbox demo groups ("Sample Applications")
            var services = window["sap-ushell-config"].services || {};
            ["FlpLaunchPage", "LaunchPage"].forEach(function (name) {
                var config = services[name] && services[name].adapter && services[name].adapter.config;
                if (config && config.groups) {
                    config.groups = config.groups.filter(function (group) {
                        return group.id === "sap_ushell_generated_group_id";
                    });
                    config.groups.forEach(function (group) { group.title = "Professional Services Automation"; });
                }
            });

            // "Sign Out" in the user menu logs out of XSUAA via the approuter
            sap.ushell.Container.registerLogout(function () {
                window.location.href = "/do/logout";
                return new Promise(function () {});   // keep waiting: the browser is leaving the page
            });

            sap.ushell.Container.createRenderer("fiori2", true).then(function (renderer) {
                renderer.placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
